<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date with Mr.Devil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Pixelify Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            max-width: 800px;
            aspect-ratio: 4 / 3; 
            background: #111;
            position: relative;
            overflow: hidden;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 600px) {
            #game-container {
                aspect-ratio: 3 / 4.5; 
            }
            #mr-devil, #groom-devil {
                width: 55% !important; 
            }
        }

        #game-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 15;
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .hidden { display: none !important; }

        .pixel-rendering { shape-rendering: crispEdges; }

        /* ---------------- 텍스트 박스 ---------------- */
        #dialogue-box {
            position: absolute;
            bottom: 0; 
            left: 0;
            width: 100%; 
            min-height: 18%; 
            height: auto; 
            background: #050505; 
            border-top: 4px solid #fff; 
            padding: 15px 20px; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            gap: 12px; 
            z-index: 20; 
        }

        @media (max-width: 600px) {
            #dialogue-box {
                min-height: 25%;
                padding: 20px 15px 25px 15px;
                gap: 20px;
                justify-content: flex-start;
            }
        }

        #dialogue-text {
            font-size: clamp(16px, 4vw, 26px);
            color: #eee;
            margin: 0;
            line-height: 1.2; 
        }

        #options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: clamp(14px, 3.5vw, 18px); 
            padding: 6px 14px; 
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .option-btn:hover {
            background: #fff;
            color: #000;
        }

        /* ---------------- 서있는 쥐 (기본 & 신랑) ---------------- */
        #mr-devil, #groom-devil {
            position: absolute;
            bottom: 25%; 
            left: 50%;
            transform: translateX(-50%);
            width: 45%; 
            height: auto;
            z-index: 5;
        }

        @media (max-width: 600px) {
            #mr-devil, #groom-devil {
                bottom: 30% !important; 
            }
        }

        /* ---------------- 오버레이 효과 ---------------- */
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 30; 
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        #overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        #you-died {
            color: #8b0000;
            font-size: clamp(40px, 10vw, 90px);
            font-weight: 700;
            text-shadow: 2px 2px 0 #000, 0 0 25px #ff0000;
            opacity: 0;
            transform: scale(0.8);
            transition: all 3s ease-in-out;
            display: none;
        }

        #you-died.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        #victory-text {
            color: #2ecc71;
            font-size: clamp(24px, 6vw, 60px); 
            font-weight: 700;
            text-shadow: 2px 2px 0 #000, 0 0 25px #27ae60;
            opacity: 0;
            transform: scale(0.8);
            transition: all 3s ease-in-out;
            display: none;
        }

        #victory-text.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        #married-text {
            color: #f1c40f; 
            font-size: clamp(30px, 8vw, 80px); 
            font-weight: 700;
            text-shadow: 2px 2px 0 #000, 0 0 25px #f39c12;
            opacity: 0;
            transform: scale(0.8);
            transition: all 3s ease-in-out;
            display: none;
        }

        #married-text.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>

<script>
    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueText = document.getElementById('dialogue-text');
    const optionsDiv = document.getElementById('options');
    
    const overlay = document.getElementById('overlay');
    const youDiedText = document.getElementById('you-died');
    const victoryText = document.getElementById('victory-text');
    const marriedText = document.getElementById('married-text');
    
    const homeBg = document.getElementById('home-bg');
    const barBg = document.getElementById('bar-bg');
    const sunsetBg = document.getElementById('sunset-bg');
    
    const frontDevil = document.getElementById('mr-devil');
    const groomDevil = document.getElementById('groom-devil');

    function setDialogue(text, options) {
        dialogueText.innerText = text;
        optionsDiv.innerHTML = ''; 
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => {
                optionsDiv.innerHTML = ''; 
                opt.action();
            };
            optionsDiv.appendChild(btn);
        });
    }

    function initHome() {
        dialogueBox.classList.remove('hidden');
        homeBg.classList.remove('hidden');
        barBg.classList.add('hidden');
        sunsetBg.classList.add('hidden');
        frontDevil.classList.remove('hidden'); 
        groomDevil.classList.add('hidden'); 
        
        setDialogue("Mr.Devil is sitting quietly.", [
            { text: "Talk", action: talkToDevil }
        ]);
    }

    function talkToDevil() {
        setDialogue("How's it going today?", [
            { text: "OK", action: () => {
                setDialogue("Stellar.", []);
                setTimeout(initHome, 2000);
            }},
            { text: "I hate life", action: () => {
                setDialogue("That's a bummer. Wanna grab a drink to change the mood?", [
                    { text: "Yeah", action: () => {
                        setDialogue("Stellar.", []);
                        setTimeout(transitionToBar, 1500);
                    }},
                    { text: "Nah", action: () => {
                        setDialogue("Whatever.", []);
                        setTimeout(initHome, 2000);
                    }}
                ]);
            }},
            { text: "Will you marry me?", action: triggerDeath }
        ]);
    }

    function transitionToBar() {
        overlay.classList.add('active'); 
        
        setTimeout(() => {
            homeBg.classList.add('hidden');
            barBg.classList.remove('hidden');
            frontDevil.classList.add('hidden'); 
            
            setDialogue("Here's to Johnny.", [
                { text: "Cheers", action: triggerVictory },
                { text: "Who's Johnny?", action: johnnyStory1 } 
            ]);
            
            overlay.classList.remove('active'); 
        }, 1000);
    }

    function johnnyStory1() {
        setDialogue("Johnny was a friend of mine who left us too soon.", [
            { text: "Oh...", action: johnnyStory2 },
            { text: "I'm sorry.", action: johnnyStory2 }
        ]);
    }

    function johnnyStory2() {
        setDialogue("Nah. He lived a good life.", [
            { text: "...", action: johnnyStory3 }
        ]);
    }

    function johnnyStory3() {
        setDialogue("Fat ass. Died trying to eat cheese from a mousetrap.", [
            { text: "...", action: johnnyStory4 }
        ]);
    }

    function johnnyStory4() {
        setDialogue("Make sure you live a life with no regrets, doing whatever the hell you want.", [
            { text: "What the hell?", action: triggerDeath },
            { text: "I try to", action: johnnyStory5 }
        ]);
    }

    function johnnyStory5() {
        setDialogue("You're not half bad, kid.", [
            { text: "...", action: transitionToGroom }
        ]);
    }

    function transitionToGroom() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            barBg.classList.add('hidden');
            homeBg.classList.remove('hidden'); 
            groomDevil.classList.remove('hidden'); 
            
            setDialogue("What's on your mind?", [
                { text: "..?", action: groomStory2 }
            ]);
            
            overlay.classList.remove('active'); 
        }, 1000);
    }

    function groomStory2() {
        setDialogue("Now all that's left is to run off into the sunset with me.", [
            { text: "...", action: transitionToSunset }
        ]);
    }

    function transitionToSunset() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            homeBg.classList.add('hidden');
            groomDevil.classList.add('hidden');
            dialogueBox.classList.add('hidden'); 
            
            sunsetBg.classList.remove('hidden'); 
            
            overlay.classList.remove('active'); 
            
            setTimeout(triggerMarriage, 2500); 

        }, 1000);
    }

    function triggerDeath() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            youDiedText.classList.add('show'); 
            setTimeout(() => {
                youDiedText.classList.remove('show'); 
                setTimeout(() => {
                    initHome(); 
                    overlay.classList.remove('active'); 
                }, 1500);
            }, 3000); 
        }, 1000);
    }

    function triggerVictory() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            victoryText.classList.add('show'); 
            setTimeout(() => {
                victoryText.classList.remove('show'); 
                setTimeout(() => {
                    initHome(); 
                    overlay.classList.remove('active'); 
                }, 1500);
            }, 3000); 
        }, 1000);
    }

    function triggerMarriage() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            marriedText.classList.add('show'); 
            setTimeout(() => {
                marriedText.classList.remove('show'); 
                setTimeout(() => {
                    initHome(); 
                    overlay.classList.remove('active'); 
                }, 1500);
            }, 3000); 
        }, 1000);
    }

    initHome();
</script>
</body>
</html>
