<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date with Mr.Devil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Pixelify Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            max-width: 800px;
            aspect-ratio: 4 / 3; 
            background: #111;
            position: relative;
            overflow: hidden;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* 📱 모바일 전용 세팅 */
        @media (max-width: 600px) {
            #game-container {
                aspect-ratio: 3 / 4.5; 
            }
            #mr-devil {
                /* 모바일에서 텍스트 박스에 가려지지 않게 높이고, 크기도 훨씬 크게 키움 */
                bottom: 35% !important; 
                width: 55% !important; 
            }
            #dialogue-box {
                padding: 15px 15px 20px 15px !important; 
                gap: 15px !important;
            }
        }

        #game-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 15;
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .hidden { display: none !important; }

        .pixel-rendering { shape-rendering: crispEdges; }

        /* ---------------- 홈 화면의 서있는 쥐 (크기 증가, 애니메이션 제거) ---------------- */
        #mr-devil {
            position: absolute;
            bottom: 26%;
            left: 50%;
            transform: translateX(-50%);
            width: 45%; /* 기존 35%에서 45%로 크기 증가 */
            height: auto;
            z-index: 5;
        }

        #dialogue-box {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; 
            min-height: 28%;
            height: auto; 
            background: #1a1a1a;
            border-top: 4px solid #fff;
            padding: 20px 20px 30px 20px; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 20px; 
            z-index: 10;
        }

        #dialogue-text {
            font-size: clamp(16px, 4vw, 28px);
            color: #eee;
            margin: 0;
            line-height: 1.4; 
        }

        #options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding-bottom: 5px; 
        }

        .option-btn {
            background: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: clamp(14px, 3.5vw, 20px);
            padding: 8px 16px; 
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .option-btn:hover {
            background: #fff;
            color: #000;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        #overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        #you-died {
            color: #8b0000;
            font-size: clamp(40px, 10vw, 90px);
            font-weight: 700;
            text-shadow: 2px 2px 0 #000, 0 0 25px #ff0000;
            opacity: 0;
            transform: scale(0.8);
            transition: all 3s ease-in-out;
            display: none;
        }

        #you-died.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        #victory-text {
            color: #2ecc71;
            font-size: clamp(24px, 6vw, 60px); 
            font-weight: 700;
            text-shadow: 2px 2px 0 #000, 0 0 25px #27ae60;
            opacity: 0;
            transform: scale(0.8);
            transition: all 3s ease-in-out;
            display: none;
        }

        #victory-text.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Home Background -->
    <svg class="bg-layer" id="home-bg" viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <!-- Wall -->
        <rect width="800" height="400" fill="#2d2d2d" class="pixel-rendering"/>
        <!-- Floor -->
        <rect y="400" width="800" height="200" fill="#1e1e1e" class="pixel-rendering"/>
        
        <!-- 💡 수정됨: 모바일에서 잘리지 않도록 벽돌들을 화면 중앙(x:200~600)으로 모음 -->
        <rect x="280" y="100" width="50" height="20" fill="#222" class="pixel-rendering"/>
        <rect x="360" y="140" width="70" height="20" fill="#222" class="pixel-rendering"/>
        <rect x="480" y="110" width="40" height="20" fill="#222" class="pixel-rendering"/>
        <rect x="520" y="220" width="60" height="20" fill="#222" class="pixel-rendering"/>
        <rect x="250" y="280" width="45" height="20" fill="#222" class="pixel-rendering"/>
        <rect x="410" y="320" width="55" height="20" fill="#222" class="pixel-rendering"/>
    </svg>
    
    <!-- Bar Background -->
    <svg class="bg-layer hidden" id="bar-bg" viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <!-- Wall -->
        <rect width="800" height="600" fill="#140a08" class="pixel-rendering"/>
        <!-- Floor -->
        <polygon points="0,280 800,120 800,600 0,600" fill="#080402" class="pixel-rendering"/>
        
        <!-- 💡 수정됨: 바 공간 사물들을 0.75배로 축소해 광각 렌즈로 멀리서 찍은 것처럼 만듦 -->
        <g transform="translate(80, 100) scale(0.75)">
            <!-- Shelf in background -->
            <polygon points="180,120 680,40 680,55 180,135" fill="#0a0504" class="pixel-rendering"/>
            <!-- Bottles -->
            <rect x="250" y="80" width="16" height="45" fill="#27ae60" class="pixel-rendering"/>
            <rect x="340" y="60" width="14" height="55" fill="#8e44ad" class="pixel-rendering"/>
            <rect x="490" y="35" width="20" height="35" fill="#e67e22" class="pixel-rendering"/>
            <rect x="580" y="20" width="15" height="50" fill="#2980b9" class="pixel-rendering"/>

            <!-- Diagonal Bar Counter -->
            <polygon points="120,330 600,180 750,220 270,370" fill="#3d2314" class="pixel-rendering"/>
            <polygon points="120,330 270,370 270,440 120,400" fill="#1c0e07" class="pixel-rendering"/>
            <polygon points="270,370 750,220 750,290 270,440" fill="#24130a" class="pixel-rendering"/>
            <polygon points="120,330 270,370 750,220 750,225 270,375 120,335" fill="#52301c" class="pixel-rendering"/>

            <!-- Mr. Devil (Side View, Sitting with Beer) & Stool - 애니메이션 완전히 제거됨 -->
            <g transform="translate(240, 110) scale(10)">
                <!-- Stool -->
                <rect x="11" y="25" width="10" height="2" fill="#4a2113" class="pixel-rendering"/>
                <rect x="15" y="27" width="2" height="7" fill="#222" class="pixel-rendering"/>
                <rect x="12" y="33" width="8" height="1" fill="#111" class="pixel-rendering"/>
                
                <!-- Tail -->
                <rect x="7" y="22" width="4" height="2" fill="#9c5468" class="pixel-rendering"/>
                <rect x="5" y="18" width="2" height="6" fill="#9c5468" class="pixel-rendering"/>
                <rect x="6" y="16" width="2" height="2" fill="#9c5468" class="pixel-rendering"/>
                
                <!-- Left Leg -->
                <rect x="15" y="23" width="2" height="4" fill="#753b4b" class="pixel-rendering"/>
                
                <!-- Body -->
                <rect x="10" y="16" width="10" height="9" fill="#444" class="pixel-rendering"/>
                <rect x="16" y="17" width="4" height="7" fill="#5a5a5a" class="pixel-rendering"/>
                
                <!-- Right Leg -->
                <rect x="11" y="22" width="7" height="3" fill="#444" class="pixel-rendering"/>
                <rect x="16" y="25" width="2" height="4" fill="#9c5468" class="pixel-rendering"/>
                
                <!-- Head -->
                <rect x="12" y="7" width="9" height="9" fill="#444" class="pixel-rendering"/>
                <rect x="21" y="11" width="4" height="4" fill="#444" class="pixel-rendering"/>
                <rect x="24" y="11" width="1" height="1" fill="#000" class="pixel-rendering"/>
                
                <!-- Eye -->
                <rect x="18" y="9" width="2" height="2" fill="#ff0000" class="pixel-rendering"/>
                <rect x="19" y="9" width="1" height="1" fill="#111" class="pixel-rendering"/>
                
                <!-- Ear -->
                <rect x="13" y="3" width="3" height="4" fill="#333" class="pixel-rendering"/>
                <rect x="14" y="4" width="1" height="2" fill="#9c5468" class="pixel-rendering"/>
                
                <!-- Arm -->
                <rect x="14" y="18" width="4" height="2" fill="#444" class="pixel-rendering"/>
                <rect x="18" y="17" width="4" height="2" fill="#444" class="pixel-rendering"/>
                <rect x="22" y="16" width="2" height="2" fill="#9c5468" class="pixel-rendering"/>
                
                <!-- Beer Mug -->
                <rect x="23" y="12" width="5" height="5" fill="#a8c3bc" class="pixel-rendering" opacity="0.9"/>
                <rect x="24" y="13" width="3" height="3" fill="#f39c12" class="pixel-rendering"/>
                <rect x="23" y="11" width="5" height="2" fill="#fff" class="pixel-rendering"/>
                <rect x="23" y="13" width="1" height="1" fill="#fff" class="pixel-rendering"/>
                <rect x="27" y="13" width="2" height="3" fill="#a8c3bc" class="pixel-rendering" opacity="0.9"/>
                <rect x="28" y="14" width="1" height="1" fill="#3d2314" class="pixel-rendering"/>
            </g>
        </g>
    </svg>
    
    <!-- Mr. Devil Front View -->
    <svg id="mr-devil" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M 23 25 L 31 25 L 31 27 L 23 27 Z" fill="#9c5468" class="pixel-rendering"/>
        <path d="M 27 23 L 29 23 L 29 25 L 27 25 Z" fill="#9c5468" class="pixel-rendering"/>
        <path d="M 19 27 L 22 27 L 22 29 L 19 29 Z" fill="#884050" class="pixel-rendering"/>
        <path d="M 10 15 L 24 15 L 24 28 L 10 28 Z" fill="#444" class="pixel-rendering"/>
        <path d="M 8 17 L 10 17 L 10 26 L 8 26 Z" fill="#444" class="pixel-rendering"/>
        <path d="M 12 18 L 22 18 L 22 28 L 12 28 Z" fill="#5a5a5a" class="pixel-rendering"/>
        <path d="M 11 27 L 14 27 L 14 29 L 11 29 Z" fill="#9c5468" class="pixel-rendering"/>
        <path d="M 5 9 L 16 9 L 16 20 L 5 20 Z" fill="#444" class="pixel-rendering"/>
        <path d="M 3 13 L 5 13 L 5 18 L 3 18 Z" fill="#444" class="pixel-rendering"/>
        <path d="M 10 13 L 15 13 L 15 19 L 10 19 Z" fill="#5a5a5a" class="pixel-rendering"/>
        <path d="M 13 4 L 18 4 L 18 10 L 13 10 Z" fill="#333" class="pixel-rendering"/>
        <path d="M 14 5 L 17 5 L 17 9 L 14 9 Z" fill="#9c5468" class="pixel-rendering"/>
        <path d="M 7 11 L 9 11 L 9 13 L 7 13 Z" fill="#ff0000" class="pixel-rendering"/>
        <path d="M 8 11 L 9 11 L 9 12 L 8 12 Z" fill="#111" class="pixel-rendering"/>
        <path d="M 2 13 L 4 13 L 4 15 L 2 15 Z" fill="#000" class="pixel-rendering"/>
    </svg>

    <div id="dialogue-box">
        <p id="dialogue-text"></p>
        <div id="options"></div>
    </div>

    <!-- Black Screen & Text Overlays -->
    <div id="overlay">
        <div id="you-died">YOU DIED</div>
        <div id="victory-text">HE THINKS YOU'RE OK</div>
    </div>
</div>

<script>
    const dialogueText = document.getElementById('dialogue-text');
    const optionsDiv = document.getElementById('options');
    const overlay = document.getElementById('overlay');
    const youDiedText = document.getElementById('you-died');
    const victoryText = document.getElementById('victory-text');
    const homeBg = document.getElementById('home-bg');
    const barBg = document.getElementById('bar-bg');
    const frontDevil = document.getElementById('mr-devil');

    function setDialogue(text, options) {
        dialogueText.innerText = text;
        optionsDiv.innerHTML = ''; 
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => {
                optionsDiv.innerHTML = ''; 
                opt.action();
            };
            optionsDiv.appendChild(btn);
        });
    }

    function initHome() {
        homeBg.classList.remove('hidden');
        barBg.classList.add('hidden');
        frontDevil.classList.remove('hidden'); 
        
        setDialogue("Mr.Devil is sitting quietly.", [
            { text: "Talk", action: talkToDevil }
        ]);
    }

    function talkToDevil() {
        setDialogue("How's it going today?", [
            { text: "OK", action: () => {
                setDialogue("Stellar.", []);
                setTimeout(initHome, 2000);
            }},
            { text: "I hate life", action: () => {
                setDialogue("That's a bummer. Wanna grab a drink to change the mood?", [
                    { text: "Yeah", action: () => {
                        setDialogue("Stellar.", []);
                        setTimeout(transitionToBar, 1500);
                    }},
                    { text: "Nah", action: () => {
                        setDialogue("Whatever.", []);
                        setTimeout(initHome, 2000);
                    }}
                ]);
            }},
            { text: "Will you marry me?", action: triggerDeath }
        ]);
    }

    function transitionToBar() {
        overlay.classList.add('active'); 
        
        setTimeout(() => {
            homeBg.classList.add('hidden');
            barBg.classList.remove('hidden');
            frontDevil.classList.add('hidden'); 
            
            setDialogue("Here's to Johnny.", [
                { text: "Cheers", action: triggerVictory },
                { text: "Who's Johnny?", action: triggerDeath }
            ]);
            
            overlay.classList.remove('active'); 
        }, 1000);
    }

    function triggerDeath() {
        overlay.classList.add('active'); 
        
        setTimeout(() => {
            youDiedText.classList.add('show'); 
            
            setTimeout(() => {
                youDiedText.classList.remove('show'); 
                
                setTimeout(() => {
                    initHome(); 
                    overlay.classList.remove('active'); 
                }, 1500);
                
            }, 3000); 
            
        }, 1000);
    }

    function triggerVictory() {
        overlay.classList.add('active'); 
        
        setTimeout(() => {
            victoryText.classList.add('show'); 
            
            setTimeout(() => {
                victoryText.classList.remove('show'); 
                
                setTimeout(() => {
                    initHome(); 
                    overlay.classList.remove('active'); 
                }, 1500);
                
            }, 3000); 
            
        }, 1000);
    }

    initHome();
</script>
</body>
</html>
