<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date with Mr.Devil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Pixelify Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            max-width: 800px;
            aspect-ratio: 4 / 3; 
            background: #111;
            position: relative;
            overflow: hidden;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 600px) {
            #game-container {
                aspect-ratio: 3 / 4.5; 
            }
            #mr-devil, #groom-devil {
                width: 55% !important; 
            }
        }

        #game-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 15;
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .hidden { display: none !important; }

        .pixel-rendering { shape-rendering: crispEdges; }

        /* ---------------- 텍스트 박스 ---------------- */
        #dialogue-box {
            position: absolute;
            bottom: 0; 
            left: 0;
            width: 100%; 
            min-height: 18%; 
            height: auto; 
            background: #050505; 
            border-top: 4px solid #fff; 
            padding: 15px 20px; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            gap: 12px; 
            z-index: 20; 
        }

        @media (max-width: 600px) {
            #dialogue-box {
                min-height: 25%;
                padding: 20px 15px 25px 15px;
                gap: 20px;
                justify-content: flex-start;
            }
        }

        #dialogue-text {
            font-size: clamp(16px, 4vw, 26px);
            color: #eee;
            margin: 0;
            line-height: 1.2; 
        }

        #options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: clamp(14px, 3.5vw, 18px); 
            padding: 6px 14px; 
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .option-btn:hover {
            background: #fff;
            color: #000;
        }

        /* ---------------- 서있는 쥐 (기본 & 신랑) ---------------- */
        #mr-devil, #groom-devil {
            position: absolute;
            bottom: 25%; 
            left: 50%;
            transform: translateX(-50%);
            width: 45%; 
            height: auto;
            z-index: 5;
        }

        @media (max-width: 600px) {
            #mr-devil, #groom-devil {
                bottom: 30% !important; 
            }
        }

        /* ---------------- 오버레이 효과 ---------------- */
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 30; 
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        #overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        #you-died {
            color: #8b0000;
            font-size: clamp(40px, 10vw, 90px);
            font-weight: 700;
            text-shadow: 2px 2px 0 #000, 0 0 25px #ff0000;
            opacity: 0;
            transform: scale(0.8);
            transition: all 3s ease-in-out;
            display: none;
        }

        #you-died.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        #victory-text {
            color: #2ecc71;
            font-size: clamp(24px, 6vw, 60px); 
            font-weight: 700;
            text-shadow: 2px 2px 0 #000, 0 0 25px #27ae60;
            opacity: 0;
            transform: scale(0.8);
            transition: all 3s ease-in-out;
            display: none;
        }

        #victory-text.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        /* 💡 추가됨: 결혼 엔딩 문구 스타일 */
        #married-text {
            color: #f1c40f; /* 황금색 */
            font-size: clamp(30px, 8vw, 80px); 
            font-weight: 700;
            text-shadow: 2px 2px 0 #000, 0 0 25px #f39c12;
            opacity: 0;
            transform: scale(0.8);
            transition: all 3s ease-in-out;
            display: none;
        }

        #married-text.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Home Background -->

                <rect x="23" y="12" width="5" height="5" fill="#a8c3bc" class="pixel-rendering" opacity="0.9"/>

                <rect x="28" y="14" width="1" height="1" fill="#3d2314" class="pixel-rendering"/>
            </g>
        </g>
    </svg>

    <!-- 💡 추가됨: Sunset Car Background (결혼 엔딩 씬) -->
    <svg class="bg-layer hidden" id="sunset-bg" viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <!-- Sky & Sunset -->
        <rect y="0" width="800" height="100" fill="#c0392b" class="pixel-rendering"/>
        <rect y="100" width="800" height="80" fill="#d35400" class="pixel-rendering"/>

        <!-- Distant Mountains -->
        <polygon points="0,320 100,250 250,320" fill="#8e44ad" class="pixel-rendering"/>
        <polygon points="150,320 300,220 450,320" fill="#8e44ad" class="pixel-rendering"/>
        <polygon points="350,320 550,200 750,320" fill="#8e44ad" class="pixel-rendering"/>
        <polygon points="650,320 750,260 800,320" fill="#8e44ad" class="pixel-rendering"/>
        
        <!-- Ground & Road -->
        <rect y="320" width="800" height="280" fill="#2c3e50" class="pixel-rendering"/>
        <polygon points="380,320 420,320 600,600 200,600" fill="#34495e" class="pixel-rendering"/>
        <polygon points="398,320 402,320 410,600 390,600" fill="#f1c40f" class="pixel-rendering"/> <!-- 차선 -->
        
        <!-- Car Dashboard -->
        <rect y="480" width="800" height="120" fill="#111" class="pixel-rendering"/>

        <!-- Mr Devil from behind (Driving) -->
        <rect x="150" y="300" width="160" height="170" fill="#111" class="pixel-rendering"/> <!-- 신랑 양복 등 -->
        <rect x="180" y="290" width="100" height="20" fill="#444" class="pixel-rendering"/> <!-- 목 -->
        <rect x="170" y="180" width="120" height="110" fill="#444" class="pixel-rendering"/> <!-- 머리 뒷모습 -->
        <rect x="150" y="150" width="40" height="50" fill="#333" class="pixel-rendering"/> <!-- 왼쪽 귀 -->
        <rect x="270" y="150" width="40" height="50" fill="#333" class="pixel-rendering"/> <!-- 오른쪽 귀 -->
        
        <!-- Player from behind (Bridal Veil) -->
        <rect x="480" y="240" width="140" height="230" fill="#fff" opacity="0.8" class="pixel-rendering"/> <!-- 늘어진 베일 -->
        <rect x="510" y="200" width="80" height="80" fill="#d35400" class="pixel-rendering"/> <!-- 플레이어 머리카락 -->
        <rect x="490" y="190" width="120" height="70" fill="#fff" opacity="0.9" class="pixel-rendering"/> <!-- 베일 머리 위 덮개 -->
        
        <!-- Steering Wheel -->
        <rect x="140" y="420" width="180" height="20" fill="#222" class="pixel-rendering"/>

    <!-- Mr. Devil Front View -->

    <!-- 💡 추가됨: 신랑 복장의 Mr. Devil (Groom) -->

        <path d="M 23 25 L 31 25 L 31 27 L 23 27 Z" fill="#9c5468" class="pixel-rendering"/>
        <path d="M 27 23 L 29 23 L 29 25 L 27 25 Z" fill="#9c5468" class="pixel-rendering"/>
        <path d="M 19 27 L 22 27 L 22 29 L 19 29 Z" fill="#884050" class="pixel-rendering"/>

        <!-- Suit Jacket Left -->
        <rect x="10" y="15" width="5" height="10" fill="#111" class="pixel-rendering"/>
        <!-- Suit Jacket Right -->
        <rect x="19" y="15" width="5" height="10" fill="#111" class="pixel-rendering"/>
        
        <!-- Head -->

        <div id="options"></div>

    <!-- Black Screen & Text Overlays -->
    <div id="overlay">
        <div id="you-died">YOU DIED</div>
        <div id="victory-text">HE THINKS YOU'RE OK</div>
        <div id="married-text">YOU ARE MARRIED TO A RAT</div>

</div>

<script>
    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueText = document.getElementById('dialogue-text');
    const optionsDiv = document.getElementById('options');
    
    const overlay = document.getElementById('overlay');
    const youDiedText = document.getElementById('you-died');
    const victoryText = document.getElementById('victory-text');
    const marriedText = document.getElementById('married-text');
    
    const homeBg = document.getElementById('home-bg');
    const barBg = document.getElementById('bar-bg');
    const sunsetBg = document.getElementById('sunset-bg');
    
    const frontDevil = document.getElementById('mr-devil');
    const groomDevil = document.getElementById('groom-devil');

    function setDialogue(text, options) {
        dialogueText.innerText = text;
        optionsDiv.innerHTML = ''; 
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => {
                optionsDiv.innerHTML = ''; 
                opt.action();
            };
            optionsDiv.appendChild(btn);
        });
    }

    function initHome() {
        dialogueBox.classList.remove('hidden');
        homeBg.classList.remove('hidden');
        barBg.classList.add('hidden');
        sunsetBg.classList.add('hidden');
        frontDevil.classList.remove('hidden'); 
        groomDevil.classList.add('hidden'); 
        
        setDialogue("Mr.Devil is sitting quietly.", [
            { text: "Talk", action: talkToDevil }
        ]);
    }

    function talkToDevil() {
        setDialogue("How's it going today?", [
            { text: "OK", action: () => {
                setDialogue("Stellar.", []);
                setTimeout(initHome, 2000);
            }},
            { text: "I hate life", action: () => {
                setDialogue("That's a bummer. Wanna grab a drink to change the mood?", [
                    { text: "Yeah", action: () => {
                        setDialogue("Stellar.", []);
                        setTimeout(transitionToBar, 1500);
                    }},
                    { text: "Nah", action: () => {
                        setDialogue("Whatever.", []);
                        setTimeout(initHome, 2000);
                    }}
                ]);
            }},
            { text: "Will you marry me?", action: triggerDeath }
        ]);
    }

    function transitionToBar() {
        overlay.classList.add('active'); 
        
        setTimeout(() => {
            homeBg.classList.add('hidden');
            barBg.classList.remove('hidden');
            frontDevil.classList.add('hidden'); 
            
            // "Who's Johnny?" 클릭시 새로운 스토리 분기 연결
            setDialogue("Here's to Johnny.", [
                { text: "Cheers", action: triggerVictory },
                { text: "Who's Johnny?", action: johnnyStory1 } 
            ]);
            
            overlay.classList.remove('active'); 
        }, 1000);
    }

    /* --------- 새로 추가된 Johnny 스토리 흐름 --------- */
    function johnnyStory1() {
        setDialogue("Johnny was a friend of mine who left us too soon.", [
            { text: "Oh...", action: johnnyStory2 },
            { text: "I'm sorry.", action: johnnyStory2 }
        ]);
    }

    function johnnyStory2() {
        setDialogue("Nah. He lived a good life.", [
            { text: "...", action: johnnyStory3 }
        ]);
    }

    function johnnyStory3() {
        setDialogue("Fat ass. Died trying to eat cheese from a mousetrap.", [
            { text: "...", action: johnnyStory4 }
        ]);
    }

    function johnnyStory4() {
        setDialogue("Make sure you live a life with no regrets, doing whatever the hell you want.", [
            { text: "What the hell?", action: triggerDeath },
            { text: "I try to", action: johnnyStory5 }
        ]);
    }

    function johnnyStory5() {
        setDialogue("You're not half bad, kid.", [
            { text: "...", action: transitionToGroom }
        ]);
    }

    function transitionToGroom() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            barBg.classList.add('hidden');
            homeBg.classList.remove('hidden'); 
            groomDevil.classList.remove('hidden'); // 양복 입은 쥐 등장
            
            setDialogue("What's on your mind?", [
                { text: "..?", action: groomStory2 }
            ]);
            
            overlay.classList.remove('active'); 
        }, 1000);
    }

    function groomStory2() {
        setDialogue("Now all that's left is to run off into the sunset with me.", [
            { text: "...", action: transitionToSunset }
        ]);
    }

    function transitionToSunset() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            homeBg.classList.add('hidden');
            groomDevil.classList.add('hidden');
            dialogueBox.classList.add('hidden'); // 풍경 감상을 위해 텍스트 박스 숨김
            
            sunsetBg.classList.remove('hidden'); // 선셋 드라이빙 배경 등장
            
            overlay.classList.remove('active'); 
            
            // 2.5초간 노을 감상 후 결혼 축하 화면 띄우기
            setTimeout(triggerMarriage, 2500); 

        }, 1000);
    }
    /* -------------------------------------------------- */


    function triggerDeath() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            youDiedText.classList.add('show'); 
            setTimeout(() => {
                youDiedText.classList.remove('show'); 
                setTimeout(() => {
                    initHome(); 
                    overlay.classList.remove('active'); 
                }, 1500);
            }, 3000); 
        }, 1000);
    }

    function triggerVictory() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            victoryText.classList.add('show'); 
            setTimeout(() => {
                victoryText.classList.remove('show'); 
                setTimeout(() => {
                    initHome(); 
                    overlay.classList.remove('active'); 
                }, 1500);
            }, 3000); 
        }, 1000);
    }

    function triggerMarriage() {
        overlay.classList.add('active'); 
        setTimeout(() => {
            marriedText.classList.add('show'); 
            setTimeout(() => {
                marriedText.classList.remove('show'); 
                setTimeout(() => {
                    initHome(); // 모든 상태 초기화하고 홈으로 복귀
                    overlay.classList.remove('active'); 
                }, 1500);
            }, 3000); 
        }, 1000);
    }

    // 게임 시작
    initHome();
</script>
